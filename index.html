<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --sky1:#1b1033; --sky2:#43205f; --cream:#fff3dc; --coral:#ff6b5e; --gold:#ffc83d;
  --btn-text:#2a1038;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0;height:100%;overflow:hidden;
  background-color:var(--sky1);
  background-image:radial-gradient(ellipse at 50% 100%,var(--sky2),var(--sky1) 70%);
  color:var(--cream);
  font-family:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;
  background-image:
    radial-gradient(1.5px 1.5px at 30px 40px,#fffc,transparent),
    radial-gradient(1px 1px at 120px 90px,#fff9,transparent),
    radial-gradient(2px 2px at 190px 20px,#ffe9a8cc,transparent),
    radial-gradient(1px 1px at 80px 160px,#fff9,transparent),
    radial-gradient(1.5px 1.5px at 170px 170px,#fffc,transparent);
  background-size:220px 200px;
  animation:twinkle 4s ease-in-out infinite alternate;
}
@keyframes twinkle{from{opacity:.45}to{opacity:1}}
main{
  position:relative;z-index:2;height:100%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:clamp(8px,2vh,18px);padding:16px;text-align:center;
}
.prompt{margin:0;font-weight:600;font-size:clamp(1rem,3.4vw,1.25rem);opacity:.85;min-height:1.5em;transition:opacity .4s}
.done .prompt{opacity:0}
h1{
  margin:0;min-height:2.2em;
  font-family:"Bagel Fat One","Trebuchet MS",system-ui,sans-serif;font-weight:400;
  font-size:clamp(2.2rem,9vw,4.8rem);line-height:1.05;
  text-shadow:0 4px 0 rgba(0,0,0,.28);
}
h1 .line{display:block}
.l{
  display:inline-block;white-space:pre;color:var(--c);
  animation:pop .75s cubic-bezier(.3,1.6,.5,1) both;
  animation-delay:calc(var(--i) * 55ms);
}
.l.static{animation:none}
@keyframes pop{
  from{opacity:0;transform:translateY(-70px) rotate(-22deg) scale(.4)}
  to{opacity:1;transform:none}
}
#cake{width:min(78vw,330px);height:auto;cursor:pointer;overflow:visible}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flick .35s ease-in-out infinite alternate;animation-delay:var(--d);transition:opacity .25s}
.glow{animation:glow .5s ease-in-out infinite alternate;transition:opacity .25s}
@keyframes flick{from{transform:scale(1,1) rotate(-3deg)}to{transform:scale(.9,1.12) rotate(3deg)}}
@keyframes glow{from{opacity:.8}to{opacity:1}}
.out .flame,.out .glow{opacity:0}
.smoke{opacity:0;fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round}
.out .smoke{animation:smoke 1.6s ease-out forwards;animation-delay:var(--d)}
@keyframes smoke{0%{opacity:.7;transform:translateY(0)}100%{opacity:0;transform:translateY(-44px)}}
.controls{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center}
input{
  font:inherit;font-weight:600;color:var(--cream);
  background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.28);
  border-radius:999px;padding:10px 18px;width:min(60vw,200px);
}
input::placeholder{color:rgba(255,243,220,.6)}
button{
  font:inherit;font-weight:800;color:var(--btn-text);background:var(--gold);
  border:0;border-radius:999px;padding:12px 24px;cursor:pointer;
  box-shadow:0 4px 0 #b5851a;transition:transform .12s,box-shadow .12s;
}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #b5851a}
input:focus-visible,button:focus-visible{outline:3px solid var(--cream);outline-offset:3px}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
@media (prefers-reduced-motion:reduce){
  .flame,.glow,body::before{animation:none}
  .l{animation:none}
}
</style>
</head>
<body>
<main id="app">
  <p class="prompt" id="prompt">Make a wish, then blow out the candles.</p>
  <h1 id="wish" aria-live="polite"></h1>

  <svg id="cake" viewBox="0 0 320 300" role="img" aria-label="Birthday cake with three lit candles">
    <defs>
      <radialGradient id="gl"><stop offset="0" stop-color="#ffc83d" stop-opacity=".55"/><stop offset="1" stop-color="#ffc83d" stop-opacity="0"/></radialGradient>
    </defs>
    <ellipse cx="160" cy="268" rx="150" ry="18" fill="#e8dcf5"/>
    <rect x="40" y="190" width="240" height="74" rx="14" fill="#ff6b5e"/>
    <rect x="40" y="190" width="240" height="16" rx="8" fill="#fff3dc"/>
    <g fill="#fff3dc"><circle cx="64" cy="206" r="9"/><circle cx="112" cy="208" r="11"/><circle cx="166" cy="206" r="9"/><circle cx="214" cy="209" r="12"/><circle cx="256" cy="206" r="9"/></g>
    <g fill="#ffc83d"><rect x="70" y="232" width="10" height="4" rx="2" transform="rotate(30 75 234)"/><rect x="130" y="240" width="10" height="4" rx="2" transform="rotate(-25 135 242)"/><rect x="190" y="230" width="10" height="4" rx="2" transform="rotate(50 195 232)"/><rect x="238" y="240" width="10" height="4" rx="2" transform="rotate(-40 243 242)"/></g>
    <g fill="#5fe3b4"><rect x="98" y="244" width="10" height="4" rx="2" transform="rotate(-50 103 246)"/><rect x="160" y="228" width="10" height="4" rx="2" transform="rotate(20 165 230)"/><rect x="214" y="246" width="10" height="4" rx="2" transform="rotate(-15 219 248)"/></g>
    <rect x="80" y="138" width="160" height="58" rx="12" fill="#ff9ec7"/>
    <rect x="80" y="138" width="160" height="14" rx="7" fill="#fff3dc"/>
    <g fill="#fff3dc"><circle cx="100" cy="152" r="8"/><circle cx="144" cy="154" r="10"/><circle cx="190" cy="152" r="8"/><circle cx="222" cy="154" r="9"/></g>

    <g>
      <rect x="120" y="92" width="10" height="46" rx="3" fill="#ffc83d"/>
      <rect x="155" y="92" width="10" height="46" rx="3" fill="#5fe3b4"/>
      <rect x="190" y="92" width="10" height="46" rx="3" fill="#7db8ff"/>
      <g stroke="#3b2a2a" stroke-width="2" stroke-linecap="round"><path d="M125 92v-6"/><path d="M160 92v-6"/><path d="M195 92v-6"/></g>
    </g>
    <g transform="translate(125 86)"><circle class="glow" cx="0" cy="-14" r="26" fill="url(#gl)"/><g class="flame" style="--d:0s"><path d="M0 0C-9-9-5-21 0-30C5-21 9-9 0 0Z" fill="#ff9a2e"/><path d="M0 0C-4-5-2-12 0-17C2-12 4-5 0 0Z" fill="#fff3a8"/></g></g>
    <g transform="translate(160 86)"><circle class="glow" cx="0" cy="-14" r="26" fill="url(#gl)"/><g class="flame" style="--d:.1s"><path d="M0 0C-9-9-5-21 0-30C5-21 9-9 0 0Z" fill="#ff9a2e"/><path d="M0 0C-4-5-2-12 0-17C2-12 4-5 0 0Z" fill="#fff3a8"/></g></g>
    <g transform="translate(195 86)"><circle class="glow" cx="0" cy="-14" r="26" fill="url(#gl)"/><g class="flame" style="--d:.2s"><path d="M0 0C-9-9-5-21 0-30C5-21 9-9 0 0Z" fill="#ff9a2e"/><path d="M0 0C-4-5-2-12 0-17C2-12 4-5 0 0Z" fill="#fff3a8"/></g></g>
    <path class="smoke" style="--d:0s" d="M125 80q-6-8 0-16q6-8 0-16"/>
    <path class="smoke" style="--d:.12s" d="M160 80q-6-8 0-16q6-8 0-16"/>
    <path class="smoke" style="--d:.24s" d="M195 80q-6-8 0-16q6-8 0-16"/>
  </svg>

  <div class="controls">
    <input id="name" type="text" maxlength="24" placeholder="Their name" aria-label="Birthday person's name" autocomplete="off">
    <button id="go" type="button">Blow out the candles</button>
  </div>
</main>
<canvas id="fx" aria-hidden="true"></canvas>

<script>
(function(){
  var cv=document.getElementById('fx'),ctx=cv.getContext('2d');
  var app=document.getElementById('app'),cake=document.getElementById('cake');
  var wish=document.getElementById('wish'),nameEl=document.getElementById('name'),go=document.getElementById('go');
  var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var COLORS=['#ff6b5e','#ffc83d','#5fe3b4','#ff9ec7','#7db8ff','#fff3dc'];
  var W,H,dpr,parts=[],balls=[],rainUntil=0,running=false,lit=true;

  function size(){
    dpr=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
    cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  addEventListener('resize',size);size();

  function rnd(a,b){return a+Math.random()*(b-a)}
  function pick(){return COLORS[Math.floor(Math.random()*COLORS.length)]}

  function cannon(x,dir,n){
    for(var i=0;i<n;i++){
      var a=-Math.PI/2+dir*rnd(.12,.65),s=rnd(10,21);
      parts.push({x:x,y:H,vx:Math.cos(a)*s,vy:Math.sin(a)*s,w:rnd(6,11),h:rnd(4,8),rot:rnd(0,6),vr:rnd(-.25,.25),t:rnd(0,6),c:pick()});
    }
  }
  function rain(n){
    for(var i=0;i<n;i++)parts.push({x:rnd(0,W),y:-12,vx:rnd(-1,1),vy:rnd(2,4),w:rnd(6,10),h:rnd(4,7),rot:rnd(0,6),vr:rnd(-.2,.2),t:rnd(0,6),c:pick()});
  }
  function balloons(n){
    var base=Math.max(24,Math.min(W,H)*.055);
    for(var i=0;i<n;i++)balls.push({x:rnd(.06,.94)*W,y:H+rnd(60,380),r:base*rnd(.9,1.35),vy:rnd(.9,2),ph:rnd(0,6),c:pick()});
  }

  function drawBalloon(b,t){
    var sway=Math.sin(t/700+b.ph)*10,x=b.x+sway;
    ctx.strokeStyle='rgba(255,243,220,.6)';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(x,b.y+b.r+6);
    ctx.quadraticCurveTo(x-sway*1.4,b.y+b.r+40,x+sway*.5,b.y+b.r+78);ctx.stroke();
    ctx.fillStyle=b.c;ctx.beginPath();ctx.ellipse(x,b.y,b.r*.8,b.r,0,0,6.2832);ctx.fill();
    ctx.beginPath();ctx.moveTo(x,b.y+b.r-1);ctx.lineTo(x-5,b.y+b.r+7);ctx.lineTo(x+5,b.y+b.r+7);ctx.closePath();ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.35)';ctx.beginPath();
    ctx.ellipse(x-b.r*.28,b.y-b.r*.38,b.r*.14,b.r*.26,.5,0,6.2832);ctx.fill();
  }

  function frame(t){
    ctx.clearRect(0,0,W,H);
    if(t<rainUntil&&!reduce)rain(2);
    var i,p;
    for(i=parts.length-1;i>=0;i--){
      p=parts[i];
      p.vx*=.985;p.vy=(p.vy+.18)*.99;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;p.t+=.15;
      if(p.y>H+20){parts.splice(i,1);continue}
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);
      ctx.fillStyle=p.c;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h*Math.abs(Math.cos(p.t))+1);
      ctx.restore();
    }
    for(i=balls.length-1;i>=0;i--){
      var b=balls[i];b.y-=b.vy;
      if(b.y<-b.r*4-90){balls.splice(i,1);continue}
      drawBalloon(b,t);
    }
    if(parts.length||balls.length||t<rainUntil)requestAnimationFrame(frame);else running=false;
  }
  function start(){if(!running){running=true;requestAnimationFrame(frame)}}

  function renderWish(animate){
    var n=nameEl.value.trim();
    var lines=n?['Happy Birthday',n+'!']:['Happy Birthday!'];
    wish.textContent='';
    var idx=0;
    lines.forEach(function(text){
      var d=document.createElement('span');d.className='line';
      for(var k=0;k<text.length;k++){
        var s=document.createElement('span');
        s.className='l'+(animate?'':' static');
        s.style.setProperty('--i',idx);
        s.style.setProperty('--c',COLORS[idx%5]);
        s.textContent=text[k];d.appendChild(s);idx++;
      }
      wish.appendChild(d);
    });
  }

  function celebrate(){
    renderWish(true);
    app.classList.add('done');
    var n=reduce?30:90;
    cannon(0,1,n);cannon(W,-1,n);
    balloons(reduce?5:11);
    rainUntil=performance.now()+(reduce?0:5000);
    start();
  }

  function blow(){
    if(!lit)return;
    lit=false;cake.classList.add('out');
    go.textContent='Light the candles again';
    setTimeout(celebrate,reduce?0:650);
  }
  function relight(){
    lit=true;cake.classList.remove('out');app.classList.remove('done');
    wish.textContent='';go.textContent='Blow out the candles';
  }

  go.addEventListener('click',function(){lit?blow():relight()});
  cake.addEventListener('click',blow);
  nameEl.addEventListener('input',function(){if(!lit)renderWish(false)});
})();
</script>
</body>
</html>
